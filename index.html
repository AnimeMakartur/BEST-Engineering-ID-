<!DOCTYPE html>
<script>
window.addEventListener('DOMContentLoaded', () => {
    // Додаємо стиль для напівпрозорості та панелі керування
    const style = document.createElement('style');
    style.textContent = `
        .faded { opacity: 0.25 !important; transition: opacity .25s ease; }
        #controls { position: fixed; left: 10px; top: 10px; background: rgba(255,255,255,0.9); padding: 8px 10px; border-radius: 6px; font-family: sans-serif; z-index: 9999; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
        #controls label { display: block; font-size: 13px; margin: 2px 0; cursor: pointer; }
        #controls input { margin-right: 6px; }
    `;
    document.head.appendChild(style);

    // Панель керування з чекбоксами
    const controls = document.createElement('div');
    controls.id = 'controls';
    const title = document.createElement('div');
    title.style.fontWeight = '600';
    title.style.marginBottom = '6px';
    title.textContent = 'Показати:';
    controls.appendChild(title);

    const items = [
        { id: 'buildings', label: 'Будівлі', selector: '.building' },
        { id: 'schools',   label: 'Школи',   selector: '.school' },
        { id: 'hospitals', label: 'Лікарні', selector: '.hospital' },
        { id: 'pipes',     label: 'Труби',   selector: '.pipe' },
        { id: 'chp',       label: 'ТЕЦ',     selector: '.chp, .chp-label' },
    ];

    items.forEach(it => {
        const label = document.createElement('label');
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.id = it.id;
        cb.checked = true;

        cb.addEventListener('change', () => {
            document.querySelectorAll(it.selector).forEach(el => {
                if (cb.checked) el.classList.remove('faded'); else el.classList.add('faded');
            });
        });

        label.appendChild(cb);
        label.appendChild(document.createTextNode(it.label));
        controls.appendChild(label);
    });

    document.body.appendChild(controls);
});
</script>
